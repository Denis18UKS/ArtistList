name: Build Jar Command Inspector EXE

on:
  push:
    branches:
      - jar-command-inspector-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild verified source
        shell: pwsh
        run: |
          python -c "from pathlib import Path; import base64, hashlib, zipfile; parts=sorted(Path('runtime_parts').glob('part_*')); b=''.join(p.read_text(encoding='ascii') for p in parts); data=base64.b64decode(b); got=hashlib.sha256(data).hexdigest(); expected='e607ff47f198cdeb4bc912aed1a6b8d01b21186846a7e8d175b15919ddfd5f6f'; print('Source SHA256:', got); assert got == expected, (got, expected); Path('source.zip').write_bytes(data); z=zipfile.ZipFile('source.zip'); print('ZIP entries:', len(z.namelist())); z.extractall('app')"
          if (!(Test-Path 'app/app.py')) { throw 'Source archive did not extract correctly' }

      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build React frontend
        working-directory: app/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build EXE
        working-directory: app
        run: python -m PyInstaller --noconfirm --clean JarCommandInspector.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = 'app/dist/JarCommandInspector.exe'
          if (!(Test-Path $exe)) { throw 'JarCommandInspector.exe was not created' }
          $item = Get-Item $exe
          Write-Host "Built: $($item.FullName) ($($item.Length) bytes)"
          if ($item.Length -lt 1000000) { throw 'EXE is unexpectedly small' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'EXE is not a PE/MZ executable' }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarCommandInspector-Windows-x64
          path: app/dist/JarCommandInspector.exe
          if-no-files-found: error
          retention-days: 7
